<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prismatrix demo</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.4 system-ui,
          sans-serif;
        --line: #2a3242;
        --muted: #8a93a6;
        --accent: #62a4da;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: minmax(260px, 340px) 1fr;
        background: #0d1017;
        color: #e3e6ec;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      aside {
        overflow-y: auto;
        border-right: 1px solid var(--line);
        font-size: 12px;
      }
      aside details {
        border-bottom: 1px solid var(--line);
      }
      aside summary {
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
        color: var(--accent);
      }
      .control {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr) 3.5em;
        gap: 6px;
        align-items: center;
        padding: 2px 12px;
      }
      .control select,
      .control input[type="color"],
      .control input[type="text"] {
        grid-column: 2 / span 2;
        min-width: 0;
      }
      .control output {
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .control.changed > span {
        color: var(--accent);
      }
      #log {
        margin: 0;
        padding: 4px 12px 12px;
        max-height: 220px;
        overflow-y: auto;
        font:
          11px/1.4 ui-monospace,
          Consolas,
          monospace;
        color: var(--muted);
        white-space: pre-wrap;
      }
      #graph {
        position: relative;
        overflow: hidden;
      }
      #status {
        margin-left: auto;
        color: var(--muted);
      }
      @media (max-width: 700px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto 40vh 1fr;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Prismatrix</strong>
      <label>
        Nodes
        <select id="size">
          <option>12</option>
          <option selected>60</option>
          <option>400</option>
          <option>3000</option>
        </select>
      </label>
      <label><input type="checkbox" id="shared" /> Shared nodes</label>
      <button id="regenerate">New graph</button>
      <button id="fit">Fit</button>
      <button id="shake">Shake</button>
      <button id="reset">Reset all</button>
      <span id="status"></span>
    </header>
    <aside
      id="panel"
      aria-label="Every option, theme colour and tuning constant"
    >
      <details open>
        <summary>Events</summary>
        <pre id="log" aria-live="polite"></pre>
      </details>
    </aside>
    <div id="graph"></div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
